name: Deploy Frontend to Azure Static Web App

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-frontend-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build Frontend
        run: |
          cd frontend
          echo "=== Running npm ci ===" > build-debug.log
          npm ci --legacy-peer-deps >> build-debug.log 2>&1
          echo "=== Running npm run build ===" >> build-debug.log
          VITE_API_BASE_URL=https://coisas-de-garagem-api-1451.azurewebsites.net/api/v1 VITE_ENABLE_MOCK_DATA=false npm run build >> build-debug.log 2>&1

      - name: Upload Build Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-debug-log
          path: frontend/build-debug.log

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_COISAS_DE_GARAGEM_WEB }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          output_location: ""
          skip_app_build: true
