name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    name: 🔐 DevSecOps Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Secrets Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      - name: 📦 SCA (Grype)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on medium

  backend-ci:
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Tells GitHub all 'run' commands happen here

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Crucial: GitHub needs to find the lockfile for caching to work
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        # We must generate the client even for tests to avoid "Prisma not found" errors
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build
