name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # -------------------------------------------------------------
  # 1. DevSecOps Security Job
  # -------------------------------------------------------------
  security:
    name: 🔐 DevSecOps Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Secrets Scanning (Gitleaks)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxf gitleaks_8.18.2_linux_x64.tar.gz
          ./gitleaks detect --verbose --redact

      - name: 🔍 SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: 📦 SCA (Grype)
        uses: anchore/scan-action@v3
        with:
          path: "."
          fail-build: true
          severity-cutoff: high

  # -------------------------------------------------------------
  # 2. Backend CI
  # -------------------------------------------------------------
  backend-ci:
    name: ☕ Backend CI
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build

  # -------------------------------------------------------------
  # 3. Frontend CI
  # -------------------------------------------------------------
  frontend-ci:
    name: ⚛️ Frontend CI
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Verify Production Build
        run: npm run build

