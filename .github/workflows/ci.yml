name: CDG | Checks and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. DevSecOps Security Job
  # -------------------------------------------------------------
  security:
    name: 🔐 DevSecOps Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔑 Secrets Scanning (Gitleaks)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxf gitleaks_8.18.2_linux_x64.tar.gz
          ./gitleaks detect --verbose --redact

      - name: 🔍 SAST (Semgrep)
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep==1.172.0
          # 'detected-aws-access-key-id-value' false-positives on phantom content not present in the repo
          # (Gitleaks, run in the previous step, already handles secret detection authoritatively).
          semgrep scan --config auto --error \
            --exclude-rule generic.secrets.security.detected-aws-access-key-id-value \
            --exclude-rule generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value

      - name: 📦 SCA (Grype)
        uses: anchore/scan-action@64a33b277ea7a1215a3c142735a1091341939ff5 # v4.1.2
        with:
          path: "."
          fail-build: false

  # -------------------------------------------------------------
  # 2. Backend CI
  # -------------------------------------------------------------
  backend-ci:
    name: ☕ Backend CI
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build

  # -------------------------------------------------------------
  # 3. Frontend CI
  # -------------------------------------------------------------
  frontend-ci:
    name: ⚛️ Frontend CI
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Verify Production Build
        run: npm run build


  deploy-cdg:
    name: Deploy CDG | Easypanel
    needs: [security, backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cdg-production-deploy
      cancel-in-progress: false
    env:
      BACKEND_DEPLOY_URL: ${{ secrets.CDG_BACKEND_DEPLOY_URL }}
      FRONTEND_DEPLOY_URL: ${{ secrets.CDG_FRONTEND_DEPLOY_URL }}
    steps:
      - name: Validate deployment secrets
        run: |
          if [[ -z "$BACKEND_DEPLOY_URL" || -z "$FRONTEND_DEPLOY_URL" ]]; then
            echo "::error::Configure CDG_BACKEND_DEPLOY_URL and CDG_FRONTEND_DEPLOY_URL in repository secrets."
            exit 1
          fi
          if [[ "$BACKEND_DEPLOY_URL" == "$FRONTEND_DEPLOY_URL" ]]; then
            echo "::error::Backend and frontend must have different deployment trigger URLs."
            exit 1
          fi

      - name: Trigger CDG backend deployment
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 120 \
            --url "$BACKEND_DEPLOY_URL"

      - name: Trigger CDG frontend deployment
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 120 \
            --url "$FRONTEND_DEPLOY_URL"

      - name: Deployment requests accepted
        run: echo "Check deployment build and runtime results in Easypanel."
