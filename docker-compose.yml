version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    container_name: garage_sale_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garagedb}
    # Porta não publicada no host: acesso só pela rede interna do Docker.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - garage_sale_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: garage_sale_backend
    ports:
      - "3000:3000"
      # Prisma Studio (5555) não é publicado no host. Para usá-lo em dev,
      # acesse via rede interna do Docker ou um túnel SSH.
    env_file:
      - ./backend/.env  # <--- This forces Docker to read your specific file
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garagedb}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garage_sale_network

  frontend:
    build: ./frontend
    container_name: garage_sale_frontend
    ports:
      - "5173:4173"
    environment:
      VITE_API_BASE_URL: http://backend:3000/api/v1
    depends_on:
      - backend
    networks:
      - garage_sale_network

volumes:
  postgres_data:

networks:
  garage_sale_network:
    driver: bridge
